<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">BT Creative studio website</title>
  <desc id="desc">A cream studio website with the headline Make it iconic, bold geometric artwork and an editorial layout.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#101915" flood-opacity="0.18"/>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#101915" opacity="0.12"/>
    </pattern>
    <clipPath id="tile1"><rect x="950" y="210" width="330" height="420" rx="8"/></clipPath>
    <clipPath id="tile2"><rect x="1120" y="330" width="330" height="420" rx="8"/></clipPath>
  </defs>

  <rect width="1600" height="1000" fill="#F6F1E5"/>
  <rect x="70" y="120" width="620" height="760" fill="url(#dots)" opacity="0.55"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <g fill="#101915">
      <text x="70" y="92" font-size="30" font-weight="800" letter-spacing="-1">BT<tspan font-size="16" dy="-12">®</tspan></text>
      <text x="190" y="90" font-size="12" font-weight="700" letter-spacing="2.5" opacity="0.55">CREATIVE STUDIO</text>
      <g font-size="13" font-weight="700" letter-spacing="1.8" opacity="0.7">
        <text x="1040" y="90">WORK</text>
        <text x="1140" y="90">SERVICES</text>
        <text x="1270" y="90">STUDIO</text>
        <text x="1380" y="90">CONTACT</text>
      </g>
      <circle cx="1518" cy="85" r="18" fill="#101915"/>
      <path d="M1512 85h12M1518 79v12" stroke="#F6F1E5" stroke-width="2"/>
      <line x1="70" y1="130" x2="1530" y2="130" stroke="#101915" stroke-opacity="0.16" stroke-width="2"/>
    </g>

    <text x="66" y="252" font-size="13" font-weight="700" letter-spacing="3" fill="#D45B36">INDEPENDENT CREATIVE STUDIO — ADDIS ABABA</text>
    <text x="60" y="422" font-size="150" font-weight="900" letter-spacing="-8" fill="#101915">MAKE IT</text>
    <text x="60" y="560" font-size="150" font-weight="900" letter-spacing="-8" fill="#101915">ICONIC.</text>
    <text x="70" y="624" font-size="21" fill="#101915" opacity="0.66">Brand, digital and campaign work for people</text>
    <text x="70" y="656" font-size="21" fill="#101915" opacity="0.66">who refuse to blend in.</text>

    <g transform="translate(70 724)">
      <rect width="214" height="56" rx="28" fill="#101915"/>
      <text x="28" y="36" font-size="14" font-weight="700" letter-spacing="1.8" fill="#F6F1E5">SEE THE WORK</text>
      <circle cx="182" cy="28" r="15" fill="#F4C84A"/>
      <path d="M176 28h12M183 23l5 5-5 5" fill="none" stroke="#101915" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="950" y="210" width="330" height="420" rx="8" fill="#1C5B44"/>
      <g clip-path="url(#tile1)">
        <circle cx="1115" cy="370" r="110" fill="none" stroke="#F6F1E5" stroke-width="2" opacity="0.35"/>
        <circle cx="1115" cy="370" r="70" fill="none" stroke="#F6F1E5" stroke-width="2" opacity="0.5"/>
        <path d="M1115 270l24 72 76 24-76 24-24 72-24-72-76-24 76-24z" fill="#F4C84A"/>
        <text x="984" y="590" font-size="12" font-weight="700" letter-spacing="2.4" fill="#F6F1E5">IDENTITY / 2025</text>
      </g>

      <rect x="1120" y="330" width="330" height="420" rx="8" fill="#D45B36"/>
      <g clip-path="url(#tile2)">
        <circle cx="1285" cy="500" r="118" fill="#F6F1E5"/>
        <circle cx="1285" cy="500" r="58" fill="#101915"/>
        <path d="M1160 690l84-158 84 158z" fill="#F4C84A"/>
        <text x="1150" y="716" font-size="12" font-weight="700" letter-spacing="2.4" fill="#F6F1E5">CAMPAIGN / 2025</text>
      </g>

      <g transform="translate(925 560)">
        <rect width="250" height="244" rx="8" fill="#F4C84A" stroke="#101915" stroke-opacity="0.15"/>
        <rect x="22" y="22" width="206" height="130" fill="#101915"/>
        <g fill="none" stroke="#F4C84A" stroke-width="2">
          <path d="M42 132V90l38-28 38 28v42"/>
          <path d="M90 132V98"/>
          <path d="M132 132v-20a20 20 0 0 1 40 0v20"/>
        </g>
        <text x="22" y="198" font-size="24" font-weight="800" letter-spacing="-0.5" fill="#101915">STAY WILD.</text>
        <text x="22" y="222" font-size="11" font-weight="700" letter-spacing="2" fill="#101915" opacity="0.6">PRINT / DIGITAL / MOTION</text>
      </g>
    </g>

    <g transform="translate(110 900)" font-size="13" font-weight="700" letter-spacing="2.2" fill="#101915" opacity="0.55">
      <text>BRANDING</text>
      <text x="150">DIGITAL</text>
      <text x="280">CAMPAIGN</text>
      <text x="420">MOTION</text>
    </g>
    <text x="1530" y="906" text-anchor="end" font-size="13" font-weight="700" letter-spacing="2.2" fill="#101915" opacity="0.55">BT©2025</text>
  </g>
</svg>
